[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-chain"
version = "0.2.0"
description = "Zero-dependency structured chain-of-thought for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Hussain Al-Saibai", email = "hussain.alsaibai@gmail.com"}]
keywords = ["ai", "agent", "chain-of-thought", "cot", "tracing", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-chain"
Repository = "https://github.com/hussain-alsaibai/tiny-chain"
Issues = "https://github.com/hussain-alsaibai/tiny-chain/issues"

[tool.setuptools]
py-modules = ["tiny_chain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
